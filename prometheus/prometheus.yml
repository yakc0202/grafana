global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["PRIVATE_IP:9090"]           # PrivateIP 치환
        labels:
          group: "prometheus"

  - job_name: "grafana_agent"
    ec2_sd_configs:
      - region: ap-northeast-2
    relabel_configs:
      # Tag: Monitoring:true
      - source_labels: [__meta_ec2_tag_Monitoring]
        regex: true
        action: keep
      # 특정 IP 제외
      - source_labels: [__meta_ec2_private_ip]
        regex: 'X.X.X.X|X.X.X.X'
        action: drop
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        replacement: ${1}:12345
      - source_labels: [__meta_ec2_tag_Hostname]
        target_label: hostname
        replacement: ${1}

